# 기본: API 만 실행(규칙 기반, PG_MODEL_MODE=disabled)
#   docker compose up -d
# 모델 서버 포함(모델 확정 후):
#   docker compose --profile model up -d
services:
  api:
    build: .
    env_file: .env
    ports:
      - "${PG_BIND:-127.0.0.1:8000}:8000"
    volumes:
      - audit-data:/srv/data
      - ./policies:/srv/policies:ro
    networks: [edge, internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  model:
    image: ollama/ollama:0.6.8
    profiles: [model]
    # 포트를 호스트에 공개하지 않는다. api 만 internal 네트워크로 접근.
    networks: [internal]
    volumes:
      - model-data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 5
    # GPU 사용 시 주석 해제(NVIDIA Container Toolkit 필요)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  edge: {}
  internal:
    internal: true   # 외부(인터넷) 경로 없음 → 모델 컨테이너에서 원문이 나갈 수 없다

volumes:
  audit-data: {}
  model-data: {}
