# 탐지 구성 기본값(처음 실행할 때 한 번 저장소에 들어간다). 이후 변경은 관리 API(대시보드)로 한다.
# - custom_rules: 키워드·정규식 사용자 규칙
# - context_detectors: 정규식으로 판단할 수 없는 기준. 로컬 모델이 criteria·examples 를 보고 찾는다.
# - 각 항목 id 가 탐지 유형이며 default.yaml 의 내장 유형과 겹칠 수 없다.
# - action: block(치환해도 전송 불가) | mask(치환 후 전송 가능) | warn(확인 필요) | allow(알림만)

modules:
  custom_rules: true
  context_model: true

# null 이면 기본 프롬프트. 직접 쓸 때는 {detectors} 자리표시자가 있어야 한다.
# 출력 형식(JSON) 지시문은 서버가 항상 덧붙이므로 여기서 바꿀 수 없다.
prompt_template: null

custom_rules:
  - id: confidential_marker
    kind: keywords
    label: 기밀 표식
    category: confidential
    severity: high
    action: warn
    token: CONFIDENTIAL_MARK
    reason: 문서에 기밀 표식 문구가 있음
    keywords: ["대외비", "사내한", "극비", "Confidential", "Internal Only", "Do Not Distribute"]

context_detectors:
  - id: unpublished_research
    label: 미공개 연구 결과
    category: confidential
    severity: high
    action: block
    token: RESEARCH
    criteria: 아직 논문·특허로 공개되지 않은 실험 결과, 수치, 결론, 연구 아이디어. 이미 출판된 논문 인용이나 일반 지식은 제외한다.
    examples:
      - 이번 실험에서 새 촉매의 수율이 93%로 기존보다 20%p 높게 나왔고 아직 논문 투고 전이야.
      - 다음 달 특허 출원할 신호처리 알고리즘의 핵심 아이디어를 정리해 줘.
    counter_examples:
      - 2019년 Nature 논문의 결과를 요약해 줘.
      - 트랜스포머 구조를 쉽게 설명해 줘.
  - id: internal_project
    label: 내부 프로젝트 정보
    category: confidential
    severity: medium
    action: mask
    token: PROJECT
    criteria: 외부에 알려지지 않은 사내 프로젝트명, 코드명, 일정, 고객사와의 계약 내용.
    examples:
      - 블루문 프로젝트는 3분기에 A사에 납품하기로 했어.
    counter_examples:
      - 오픈소스 프로젝트 기여 방법을 알려 줘.
  - id: trade_secret
    label: 영업비밀
    category: confidential
    severity: high
    action: block
    token: SECRET_DOC
    criteria: 원가, 미공개 가격 정책, 공정 레시피, 비공개 소스코드 등 회사가 비밀로 관리하는 정보.
    examples:
      - 우리 제품 원가는 개당 3,200원이고 납품가는 4,100원이야.
    counter_examples:
      - 원가 계산 방법을 일반적으로 설명해 줘.
  - id: sensitive_personal
    label: 민감한 개인정보
    category: sensitive_personal
    severity: high
    action: mask
    token: SENSITIVE
    criteria: 특정인과 연결된 건강·질병·유전·생체·정치 성향·종교 등 민감정보.
    examples:
      - 김OO 팀장이 지난주 당뇨 진단을 받아서 휴직한대.
    counter_examples:
      - 당뇨병 예방에 좋은 습관을 알려 줘.
  - id: third_party_record
    label: 제3자 원본 데이터
    category: third_party
    severity: high
    action: block
    token: RECORD
    criteria: 고객·환자·학생 등 제3자에 대한 원본 기록(명단, 상담 기록, 성적, 진료 기록)을 붙여 넣은 것.
    examples:
      - "다음 학생 성적표를 분석해 줘: 홍길동 수학 82, 영어 75 / 김철수 수학 91, 영어 88"
    counter_examples:
      - 성적 분포를 분석하는 일반적인 방법을 알려 줘.
