# 전송 목적지(외부 AI 제공사·접근 경로)별 안내 정보. 판정에는 사용하지 않는다.
# 근거: docs/ai-model-data-policy.json (조회일 2026-10-31, 공식 원문 대조 정정판). 제공사 정책이 바뀌면 이 파일과 policy version 을 함께 갱신한다.
#
# 원칙
# - 목적지 등급은 모달 안내에만 사용한다. 내용에 따른 탐지 조치·판정은 바꾸지 않는다.
# - standard 는 '문서상 기본 학습 안 함'일 뿐 안전 보장이 아니다. 보관·남용 모니터링·ZDR 여부는 계약마다 다르다.
# - 브라우저·CLI 는 사용자의 요금제·계약(ZDR 등)을 알 수 없다. 클라이언트가 보낸 목적지는 분류값일 뿐이며,
#   기본 등급보다 낮은 등급(예: enterprise, api)은 org_contracts 에 등록된 경우에만 인정한다.
# - 목적지를 모르거나 프로필에 없으면 default_tier 를 적용한다.

default_tier: elevated

# 근거 재확인 주기(일). verified_at 이후 이 기간이 지나면 해당 제공사는 default_tier 이상으로 강화된다.
stale_after_days: 90

tiers:
  # 문서상 상업 계약 경로에서 기본적으로 학습에 쓰지 않음
  standard: {}
  # 기본 학습 사용·opt-out 방식·장기 보관, 또는 학습 정책을 확인하지 못한 소비자 경로
  elevated: {}
  # 학습·보관·저장 국가가 문서 간 충돌하거나 조직 승인 범위 밖 국가 저장이 명시된 경로
  restricted: {}

# 조직이 실제로 계약·승인한 목적지(관리자만 수정). 여기에 없는 enterprise/api/cloud 주장은 기본 등급으로 처리한다.
# 예) - { provider: openai, channel: api }
org_contracts: []

# verified_at: 해당 제공사 공식 문서를 사람이 마지막으로 확인한 날짜
# channel 값: consumer(소비자 앱·웹), enterprise(Team·Enterprise 등 조직 계약), api, api_free, cloud(Bedrock·Vertex 등), self_hosted
profiles:
  anthropic:
    verified_at: 2026-10-31
    channels:
      consumer:   { tier: elevated, basis: "설정 ON 시 학습, 학습 ON이면 비식별 데이터 최대 5년 보관" }
      enterprise: { tier: standard, basis: "상업용(Team·Enterprise) 학습 안 함" }
      api:        { tier: standard, basis: "명시적 허가 없이 학습 안 함, Covered Models는 30일 보존" }
      cloud:      { tier: standard, basis: "제3자 플랫폼 상업 조건, 학습 안 함" }
  openai:
    verified_at: 2026-10-31
    channels:
      consumer:   { tier: elevated, basis: "ChatGPT 소비자 학습 정책 확인 불가(403)" }
      enterprise: { tier: standard, basis: "비즈니스 데이터 기본 학습 안 함" }
      api:        { tier: standard, basis: "opt-in 없이는 학습 안 함, 남용 모니터링 로그 최대 30일" }
  google:
    verified_at: 2026-10-31
    channels:
      consumer:   { tier: elevated, basis: "Keep Activity ON 시 학습, 기본 18개월 보관, 사람 검토 대화 최대 3년" }
      api_free:   { tier: elevated, basis: "무료 API: 제품·ML 개선에 사용, 사람 검토 가능" }
      api:        { tier: standard, basis: "유료 API: 제품 개선에 사용 안 함(남용 감시 로그 기간 미명시, 검색·지도 그라운딩은 30일 저장·끌 수 없음)" }
      cloud:      { tier: standard, basis: "Vertex AI: 엔터프라이즈 DPA·ZDR 경로" }
  meta:
    verified_at: 2026-10-31
    channels:
      consumer:   { tier: elevated, basis: "AI 기능과의 상호작용을 학습에 사용, 계정 단위 opt-out 미확인" }
      self_hosted: { tier: standard, basis: "Llama 자체 호스팅(외부 전송 없음 주장은 공식 문서 근거 아님)" }
  xai:
    verified_at: 2026-10-31
    channels:
      consumer:   { tier: elevated, basis: "소비자 Grok 학습 정책 확인 불가" }
      enterprise: { tier: standard, basis: "API 입출력 학습 안 함, 요청·응답 30일 감사 저장" }
      api:        { tier: standard, basis: "API 입출력 학습 안 함" }
  deepseek:
    verified_at: 2026-10-31
    channels:
      consumer:   { tier: restricted, basis: "PRC 처리·저장 명시([충돌]), 비식별 후 개선에 사용, 고정 보관 기간 없음" }
      api:        { tier: restricted, basis: "PRC 처리·저장 명시([충돌]), 계정 존속 기간 보관" }
  moonshot:
    verified_at: 2026-10-31
    channels:
      consumer:   { tier: restricted, basis: "학습·최적화를 처리 목적으로 명시, 서버 위치 [충돌]" }
      api:        { tier: restricted, basis: "학습 사용 여부·서버 위치가 문서 간 [충돌]" }
  mistral:
    verified_at: 2026-10-31
    channels:
      consumer:   { tier: elevated, basis: "Vibe(구 Le Chat) 입출력 기본 학습(opt-out 가능), 삭제 전까지 보관" }
      enterprise: { tier: standard, basis: "Vibe Enterprise 기본 opt-out" }
      api:        { tier: elevated, basis: "기본 학습 안 함(Commercial Terms 4.2)이나 기본 opt-in 제품·Studio Free·Labs 모델 예외, Pay-as-you-go 기본값 미명시, 30일 롤링 보관" }
  cohere:
    verified_at: 2026-10-31
    channels:
      api:        { tier: elevated, basis: "SaaS 30일 보관, 학습 기본값 미확인" }
      enterprise: { tier: standard, basis: "엔터프라이즈 계약·DPA가 규율" }
  amazon:
    verified_at: 2026-10-31
    channels:
      cloud:      { tier: standard, basis: "Bedrock 입출력을 학습에 쓰지 않고 모델 제공사와 공유 안 함" }
  perplexity:
    verified_at: 2026-10-31
    channels:
      consumer:   { tier: elevated, basis: "소비자 플랜 학습 정책 확인 불가" }
      enterprise: { tier: standard, basis: "엔터프라이즈 데이터 학습·파인튜닝 안 함" }
      api:        { tier: standard, basis: "API 약관상 Customer Content 학습 안 함(제품별 약관에 따라 다를 수 있음)" }
  microsoft:
    verified_at: 2026-10-31
    channels:
      consumer:   { tier: elevated, basis: "개인 계정 학습 opt-out 방식, 대화 18개월 보관" }
      enterprise: { tier: standard, basis: "테넌트 관리자 opt-in 없으면 학습 안 함" }
  alibaba:
    verified_at: 2026-10-31
    channels:
      consumer:   { tier: elevated, basis: "Qwen Chat: 비식별 콘텐츠를 학습에 사용 가능" }
      api:        { tier: standard, basis: "Model Studio: 학습 안 함, 최대 30일 보관" }
      self_hosted: { tier: standard, basis: "Qwen 가중치 자체 호스팅" }
