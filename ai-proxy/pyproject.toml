[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-proxy"
version = "0.1.0"
description = "검사 서버를 사용하는 AI API 필터링 프록시"
requires-python = ">=3.10"
dependencies = ["httpx==0.28.1", "uvicorn==0.34.2"]

[project.scripts]
ai-proxy = "ai_proxy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_proxy*"]

[tool.pytest.ini_options]
testpaths = ["tests", "../server/tests/test_cli.py"]
pythonpath = ["."]
