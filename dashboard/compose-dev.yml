# Requires Docker Compose 2.24.4 or later for !override.
services:
  backend:
    extends:
      file: compose.yaml
      service: backend
    # Keep the packaged migrations current with the bind-mounted demo callback.
    pull_policy: build
    ports: !override
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-8080}:8080"
    environment:
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,filesystem:/app/dev-sql
    volumes:
      - ./dev/sql:/app/dev-sql:ro

  mysql:
    extends:
      file: compose.yaml
      service: mysql
    volumes: !override
      - dev-mysql-data:/var/lib/mysql

volumes:
  dev-mysql-data:
