server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  application:
    name: ai-security-dashboard
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ai_security_dashboard?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:dashboard}
    password: ${DB_PASSWORD:dashboard-local}
    hikari:
      maximum-pool-size: 10
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
  mvc:
    log-request-details: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
