plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.10.0'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    inputs.property('mysqlIntegrationEnabled', providers.environmentVariable('TEST_DB_URL').isPresent())
    inputs.property('migrationIntegrationEnabled', providers.environmentVariable('TEST_MIGRATION_DB_URL').isPresent())
    // A real database is mutable external state; do not reuse a previous integration result.
    outputs.upToDateWhen {
        !providers.environmentVariable('TEST_DB_URL').isPresent() &&
            !providers.environmentVariable('TEST_MIGRATION_DB_URL').isPresent()
    }
}
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
}

def frontendDirectory = layout.projectDirectory.dir('../frontend')
def frontendOutput = layout.buildDirectory.dir('generated/frontend')

tasks.register('frontendInstall', Exec) {
    workingDir frontendDirectory
    commandLine 'npm', 'ci', '--no-audit', '--no-fund'
    inputs.files(frontendDirectory.file('package.json'), frontendDirectory.file('package-lock.json'))
    outputs.dir(frontendDirectory.dir('node_modules'))
}

tasks.register('frontendBuild', Exec) {
    dependsOn 'frontendInstall'
    workingDir frontendDirectory
    commandLine 'npm', 'run', 'build'
    inputs.dir(frontendDirectory.dir('src'))
    inputs.files(fileTree(frontendDirectory.dir('public')))
    inputs.files(fileTree(frontendDirectory) {
        include '*.json', '*.html', '*.ts', '*.js'
    })
    outputs.dir(frontendDirectory.dir('dist'))
}

tasks.register('bundleFrontend', Sync) {
    dependsOn 'frontendBuild'
    from frontendDirectory.dir('dist')
    into frontendOutput.map { it.dir('static') }
}

// bootRun and backend tests remain usable before the frontend is built.
tasks.named('bootJar') {
    dependsOn 'bundleFrontend'
    from(frontendOutput) { into 'BOOT-INF/classes' }
    archiveFileName = 'ai-security-dashboard.jar'
}

tasks.named('jar') { enabled = false }
