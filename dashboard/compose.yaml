services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # A host-shell DB_URL must not replace the Compose network address.
      DB_URL: "jdbc:mysql://mysql:3306/ai_security_dashboard?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
      DB_USERNAME: ${DB_USERNAME:-dashboard}
      DB_PASSWORD: ${DB_PASSWORD:-dashboard-local}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_security_dashboard
      MYSQL_USER: ${DB_USERNAME:-dashboard}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dashboard-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql-data:
