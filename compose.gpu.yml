# Compatibility overlay; compose.yml now uses NVIDIA GPU by default.
services:
  decider:
    build:
      target: cuda
    environment:
      # -1 offloads all layers; use a smaller positive count if VRAM is limited.
      DECIDER_GPU_LAYERS: ${DECIDER_GPU_LAYERS:--1}
      DECIDER_REQUIRE_GPU: "true"
